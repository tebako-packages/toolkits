# Feedstock recipe for jq — a REPACK feedstock: upstream's official static
# builds are fetched (sha256-pinned, cross-checked against upstream's own
# published sums), staged, and pressed as a .tfs payload. Nothing compiles
# on any leg.
name: "jq"
kind: toolkit
summary: "jq — the command-line JSON processor (upstream static build)"

upstream:
  version: "1.8.2"
  homepage: "https://jqlang.github.io/jq/"
  # The code license is MIT (COPYING at the release's source tag); jq's
  # manual is CC-BY-3.0. Both notices ride the payload (see license_file).
  license: "MIT"
  release: "https://github.com/jqlang/jq/releases/download/jq-1.8.2"
  # Upstream-published checksum document. The per-triplet pin below is the
  # trust anchor; build cross-checks it against this file at fetch time
  # (the same doctrine as the tfs toolchain pin).
  sums: {file: "sha256sum.txt", format: "sha256sum"}
  # MIT requires the notice to accompany copies: the license file at the
  # release's source tag, pinned like every other fetched byte.
  license_file:
    url: "https://raw.githubusercontent.com/jqlang/jq/jq-1.8.2/COPYING"
    sha256: "ad2b4a266b2268939c1446979759706077421cf906a203aa188c6f396e8cfd74"
  # Per-tebako-triplet upstream asset (a bare static binary) + its sha256.
  assets:
    aarch64-macos:       {file: "jq-macos-arm64",       sha256: "2d75340ba57a4b4b4c8708a21c2dc8e958a48aaa8bba13b27f77f6e4c0eca07e"}
    x86_64-macos:        {file: "jq-macos-amd64",       sha256: "e94b266e3c26690550006abe63152b782280f4e14374accdf04cbde844f00bc0"}
    x86_64-linux-gnu:    {file: "jq-linux-amd64",       sha256: "b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f"}
    aarch64-linux-gnu:   {file: "jq-linux-arm64",       sha256: "8b85c817833814ddca00a144c33705546355afccf0cf39b188f3cdb48b852309"}
    x86_64-windows-ucrt: {file: "jq-windows-amd64.exe", sha256: "a6fc67fedaf9128a3309a1e2ebb8b986aeccf70122ee46d2cb4849e423f0c627"}

build:
  system: repack        # fetch upstream's verified static build → stage → image

# Image tooling (every leg): the tfs CLI from the tamatebako/tebako
# release — `tfs mkimage` (limnifs, the default tebako image format) is
# the imager and the boot smoke's info/tree/extract reader. The asset
# digests are pinned here (the repo's toolchain pin SSOT — the same
# trust-anchor role as the upstream asset pins) and cross-checked against
# the release's own SHA256SUMS at fetch time (lib/common.sh's download_tfs).
tools:
  repo: "tamatebako/tebako"
  release: "v2.8.83"
  sha256:
    linux-gnu-x86_64: "126777314d562d74b8ff7aacc33256dc2fa0e248e7b6d914eac29679ddd728b2"
    linux-gnu-arm64: "41472b8b936eb6c482bec4b595e8b80c21c6499492cf8d4128c980f362a4450c"
    macos-arm64: "a8c5481736801f72cd9c3da648ec208601187ac4335e19086bb5ea28c203feed"
    macos-x86_64: "5003bd83fe93a5e707bbb519ee78ec01008f44a2e0d5ba32cbc59a349f03e8e8"
    windows-ucrt64: "a965052e5ccc6e9589b17b4004d3b645650fb08cd16e34bf9b0651d882d24fdf"

platforms:
  - x86_64-linux-gnu
  - aarch64-linux-gnu
  - aarch64-macos
  - x86_64-macos
  - x86_64-windows-ucrt

provides:
  executables:
    # the windows image carries /bin/jq.exe (stage fills the suffix)
    - {name: "jq", path: "/bin/jq", version: "1.8.2"}
  libraries: []

# The boot smoke's run contract (tools/boot_smoke): the packaged binary
# runs from the extracted image and answers before any leg goes green.
smoke:
  version: {argv: ["--version"], expect: "jq-1.8.2"}
  functional: {argv: ["-n", "{ok:true}"], expect: '"ok": true'}

exec_tier: static         # upstream's static build; macOS/windows link OS libraries only (verified — see README's provenance table)
exec_closure: []          # static tier
